      svg{
        --surface:#1a1a19;
        --ink:#ffffff;
        --ink-secondary:#c3c2b7;
        --empty:#2a2a28;
      }
    }
    .bg{fill:var(--surface)}
    .ink{fill:var(--ink)}
    .ink-sec{fill:var(--ink-secondary)}
    .empty{fill:var(--empty)}
    .step-100{fill:#cde2fb}
