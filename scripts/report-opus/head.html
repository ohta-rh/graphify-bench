<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opus 5.5 対 Sonnet 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#F5F6F3; --panel:#FCFCFB; --ink:#1C2024; --ink-2:#5F6B67; --rule:#D8DDD9; --rule-2:#EEF0EC;
    --accent:#3E4B9A; --good:#0B8C7F; --bad:#B24A2A; --nd:#8A9190; --code:#ECEEE9; --hl:#E3EFEC; --bar:#B9C4C0;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#15181A; --panel:#1C2023; --ink:#E6E9E6; --ink-2:#9AA39F; --rule:#2C3235; --rule-2:#232829;
      --accent:#9AA6E8; --good:#3DB3A5; --bad:#E0785A; --nd:#7C8683; --code:#22272A; --hl:#1F2F2C; --bar:#3A4448;
    }
  }
  :root[data-theme="dark"]{
    --ground:#15181A; --panel:#1C2023; --ink:#E6E9E6; --ink-2:#9AA39F; --rule:#2C3235; --rule-2:#232829;
    --accent:#9AA6E8; --good:#3DB3A5; --bad:#E0785A; --nd:#7C8683; --code:#22272A; --hl:#1F2F2C; --bar:#3A4448;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif;font-size:15.5px;line-height:1.9;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:56px 24px 96px}
  .col{max-width:68ch}
  h1,h2,h3{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
  h1{font-size:clamp(26px,4vw,38px);line-height:1.4;word-break:auto-phrase}
  h2{font-size:22px;line-height:1.5;margin-top:72px;padding-top:20px;border-top:1px solid var(--rule)}
  h3{font-size:17px;margin-top:28px;font-weight:700}
  p{margin:14px 0}
  .eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
  .lede{font-size:17px;color:var(--ink-2);margin-top:18px}
  ul{padding-left:1.3em} li{margin:8px 0} li::marker{color:var(--ink-2)}
  .g{color:var(--good)} .b{color:var(--bad)} .q{color:var(--ink-2)}
  code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13.5px;background:var(--code);padding:1px 5px}

  /* scoreboard */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:28px 0 6px}
  .card{background:var(--panel);border:1px solid var(--rule);padding:16px 18px}
  .card .who{font-family:"Shippori Mincho",serif;font-size:15px;line-height:1.5;min-height:3em}
  .card .who small{display:block;font-family:"Noto Sans JP",sans-serif;font-size:12px;color:var(--ink-2)}
  .card .res{margin-top:10px;font-family:"Shippori Mincho",serif;font-size:19px}
  .card .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:10px;font-size:12.5px;align-items:baseline}
  .card .kv span{color:var(--ink-2)}
  .card .kv b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:500;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .win{border-top:3px solid var(--good)} .lose{border-top:3px solid var(--bad)} .draw{border-top:3px solid var(--nd)}

  .chart{margin:22px 0 8px;background:var(--panel);border:1px solid var(--rule);padding:18px 18px 12px}
  .chart svg{width:100%;height:auto;display:block;overflow:visible}
  .chart-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px 20px;margin-bottom:6px}
  .chart-head strong{font-family:"Shippori Mincho",serif;font-size:16px}
  .cap{font-size:12.5px;color:var(--ink-2);margin:6px 0 0}
  .tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--ground);font-size:12.5px;padding:8px 10px;border-radius:2px;line-height:1.5;opacity:0;transition:opacity .12s;max-width:300px;z-index:9}

  table{border-collapse:collapse;width:100%;font-size:14px;margin:14px 0}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
  th{font-weight:500;color:var(--ink-2);font-size:12.5px;letter-spacing:.04em;border-bottom:1px solid var(--rule)}
  td.n,th.n{text-align:right;font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tbl{overflow-x:auto}
  .verdict{margin:24px 0;padding:18px 22px;border-left:3px solid var(--accent);background:var(--panel)}
  .verdict p{margin:6px 0}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
  .pair div{padding:16px 18px;background:var(--panel);border:1px solid var(--rule)}
  .pair b{display:block;font-family:"Shippori Mincho",serif;font-size:16px;margin-bottom:6px}
  .pair ul{margin:0;padding-left:1.2em;font-size:14px}
  details{margin:18px 0;border:1px solid var(--rule);background:var(--panel)}
  summary{padding:12px 16px;cursor:pointer;font-family:"Shippori Mincho",serif;font-size:15px}
  details > div{padding:0 16px 12px}
  a{color:var(--accent);text-underline-offset:3px}
  a:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .foot{margin-top:72px;padding-top:18px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink-2)}
  @media (max-width:760px){.board{grid-template-columns:1fr 1fr}.pair{grid-template-columns:1fr}h2{margin-top:56px}.matrix{grid-template-columns:90px 1fr 1fr}.m-rowverdict{grid-column:1/-1;padding:8px 0 14px}.m-colverdict{grid-column:2/4}.kv b{font-size:16px}.charts2{grid-template-columns:1fr}}
  @media (max-width:460px){.board{grid-template-columns:1fr}}

  /* ---- levers section ---- */
    --accent:#3E4B9A; --good:#0B8C7F; --bad:#B24A2A; --nd:#8A9190; --code:#ECEEE9; --hl:#E3EFEC; --bar:#B9C4C0;
      --accent:#9AA6E8; --good:#3DB3A5; --bad:#E0785A; --nd:#7C8683; --code:#22272A; --hl:#1F2F2C; --bar:#3A4448;
    --accent:#9AA6E8; --good:#3DB3A5; --bad:#E0785A; --nd:#7C8683; --code:#22272A; --hl:#1F2F2C; --bar:#3A4448;
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .matrix{display:grid;grid-template-columns:120px 1fr 1fr 190px;grid-template-rows:auto auto auto auto;margin:28px 0 8px}
  .matrix > *{min-width:0}
  .m-corner{}
  .m-colhead{padding:0 14px 10px;font-family:"Shippori Mincho",serif;font-size:15px}
  .m-colhead small{display:block;font-family:"Noto Sans JP",sans-serif;font-size:12px;color:var(--ink-2)}
  .m-rowhead{padding:14px 12px 0 0;font-family:"Shippori Mincho",serif;font-size:15px}
  .m-rowhead small{display:block;font-family:"Noto Sans JP",sans-serif;font-size:12px;color:var(--ink-2)}
  .cellbox{margin:0 0 0 0;padding:16px 18px;background:var(--panel);border:1px solid var(--rule);border-right-width:0;border-bottom-width:0}
  .cellbox.r{border-right-width:1px}
  .cellbox.d{border-bottom-width:1px}
  .cellbox.best{background:var(--hl)}
  .cellbox .nm{font-size:12px;color:var(--ink-2);margin-bottom:8px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
  .kv span{font-size:12.5px;color:var(--ink-2)}
  .kv b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:500;font-size:19px;line-height:1.25;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .kv b i{font-style:normal;font-size:12px;color:var(--ink-2);margin-left:6px;font-weight:400}
  .m-rowverdict{padding:14px 0 0 16px;font-size:13px;line-height:1.7;display:flex;align-items:center}
  .m-colverdict{padding:12px 14px 0;font-size:13px;line-height:1.7}
  .arrow{font-family:"IBM Plex Mono",monospace;color:var(--accent);margin-right:6px}
  .vd b{display:block;font-family:"Shippori Mincho",serif;font-size:14px;margin-bottom:2px}
  .charts2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (prefers-reduced-motion: reduce){.tip{transition:none}}
</style>
<style>
  .kicker{margin:8px 0 0;font-size:13px;color:var(--ink-2)}
  .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:6px 0 0}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
</style>
<style>
  .rep td:first-child{white-space:nowrap;padding-right:16px}
  .rep td.n .q{display:block;font-size:11.5px;line-height:1.4}
  .rep td.n{line-height:1.5}
</style>
</head>
